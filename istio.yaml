apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: pathnex-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingress
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: pathnex
  namespace: nginx
spec:
  hosts:
    - "*"
  gateways:
    - istio-ingress/pathnex-gateway
  http:
    - match:
        - uri:
            prefix: /apache
      rewrite:
        uri: /
      route:
        - destination:
            host: apache.apache.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            prefix: /httpbin
      rewrite:
        uri: /
      route:
        - destination:
            host: httpbin.httpbin.svc.cluster.local
            port:
              number: 80
    - route:
        - destination:
            host: pathnex.nginx.svc.cluster.local
            port:
              number: 80
